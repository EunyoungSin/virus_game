services:
  postgres:
    image: postgres:16
    container_name: checkpoint-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: checkpoint
      POSTGRES_USER: checkpoint
      POSTGRES_PASSWORD: checkpoint
    ports:
      - "5432:5432"
    volumes:
      - checkpoint-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checkpoint -d checkpoint"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  checkpoint-postgres-data:
