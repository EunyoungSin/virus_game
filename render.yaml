services:
  - type: web
    name: checkpoint-backend
    runtime: java
    plan: free
    rootDir: backend
    buildCommand: ./gradlew clean bootJar -x test
    startCommand: java -jar build/libs/checkpoint-0.0.1-SNAPSHOT.jar
    healthCheckPath: /actuator/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
